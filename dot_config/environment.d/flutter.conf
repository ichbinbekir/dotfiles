# Flutter + Android SDK, read by the systemd user manager at login
# (every app in the session gets these, including fish and VS Code).
# Tools live in their default places: Flutter via FVM in ~/fvm, Android SDK in ~/Android/Sdk.
ANDROID_HOME=${HOME}/Android/Sdk
PATH=${HOME}/fvm/default/bin:${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/emulator:${ANDROID_HOME}/cmdline-tools/latest/bin:${PATH}
