# Start espanso once the KDE Plasma desktop is up, not right at login (default.target):
# started too early, the Wayland compositor isn't ready yet and the worker crashes with
# "NoCompositor" before systemd restarts it. Stop it with the graphical session at logout.
[Unit]
After=graphical-session.target
PartOf=graphical-session.target

# Enable under graphical-session.target instead of the package's default.target,
# so a plain `systemctl --user enable espanso` does the right thing.
[Install]
WantedBy=
WantedBy=graphical-session.target
